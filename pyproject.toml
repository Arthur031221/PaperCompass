[project]
name = "papercompass"
version = "0.1.0"
description = "Recommendations over your own paper library, not another digest bot."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arthur031221" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sentence-transformers==3.3.1",
    "numpy==2.2.1",
    "requests==2.32.3",
    "python-multipart==0.0.20",
]

[project.scripts]
papercompass = "papercompass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papercompass"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
